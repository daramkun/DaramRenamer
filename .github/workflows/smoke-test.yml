name: Smoke test release (headless Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to test
        required: true
        default: '2026.11.1'

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Download release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "${{ inputs.version }}" -R $env:GITHUB_REPOSITORY -p "*${{ matrix.rid }}.zip" -D dl
        Expand-Archive dl\*.zip app

    - name: Launch and observe
      shell: pwsh
      run: |
        Get-CimInstance Win32_VideoController | Select-Object Name | Format-List
        [Console]::OutputEncoding | Out-Null
        $p = Start-Process "app\DaramRenamer.exe" -PassThru
        Start-Sleep 10
        $crashed = $p.HasExited
        if ($p.HasExited) {
          "EXITED code: $($p.ExitCode) (0x{0:X})" -f $p.ExitCode
        } else {
          "RUNNING after 10s"
          Stop-Process $p -Force
        }
        Get-ChildItem "$env:TEMP\DaramRenamer.UnhandledException.log", "app\UnhandledException.log" -ErrorAction SilentlyContinue |
          ForEach-Object { "--- $($_.FullName)"; Get-Content $_ }
        Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
          Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting' } |
          Select-Object -First 5 | ForEach-Object { $_.Message }
        if ($crashed) { exit 1 }
